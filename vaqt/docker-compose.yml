# Vaqt (kun rejasi, fokus, odatlar): bitta konteyner (FastAPI + SQLite + Web Push + Whisper + statik PWA). Traefik orqali HTTPS.
services:
  app:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /srv
    environment:
      APP_PIN: ${APP_PIN}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      TZ: ${TZ}
      STT_MODEL: ${STT_MODEL}
      REMINDERS: ${REMINDERS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DATA_DIR: /data
      STATIC_DIR: /srv/public
      PYTHONPATH: /deps
      PYTHONUNBUFFERED: "1"
      BUNDLE: ""
    command:
      - sh
      - -c
      - >-
        set -e;
        rm -rf /srv/app /srv/public;
        printf %s "$$BUNDLE" | base64 -d | tar xz -C /srv;
        if [ "$$(cat /deps/.req 2>/dev/null)" != "$$(cat /srv/requirements.txt)" ]; then
        pip install --no-cache-dir -q --root-user-action=ignore --target /deps --upgrade -r /srv/requirements.txt && cp /srv/requirements.txt /deps/.req; fi;
        unset BUNDLE;
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaqt.rule=Host(`vaqt.srv2041236.hstgr.cloud`)
      - traefik.http.routers.vaqt.entrypoints=websecure
      - traefik.http.routers.vaqt.tls.certresolver=letsencrypt
      - traefik.http.services.vaqt.loadbalancer.server.port=8000
    volumes:
      - vaqt_data:/data
      - vaqt_deps:/deps

volumes:
  vaqt_data:
  vaqt_deps:
